services:
  teron-db:
    image: postgres:16-alpine
    container_name: teron_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teron_os
    ports:
      - '5434:5432'
    volumes:
      - teron_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d teron_os']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  teron_pgdata:
